# `php` and `scheduler` are the same image with the same code, .env and storage mounted —
# they differ only in what they run. Defined once so the two cannot drift apart.
x-php: &php
  image: shopping_list-php
  build:
    context: ./docker/php
    args:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  volumes:
    - ./back:/var/www/html
    - ${SHARED_PATH:-.}/back/.env:/var/www/html/.env
    - ${SHARED_PATH:-.}/back/storage:/var/www/html/storage
    - ${SHARED_PATH:-.}/docker/volumes/php_home:/home/app
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.30.0-trixie
    ports:
      - "${NGINX_PORT:-8000}:80"
      - "${NGINX_FRONT_PORT:-8080}:81"
    volumes:
      - ./back:/var/www/html:ro
      - ./front/dist/pwa:/var/www/front:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/front.conf:/etc/nginx/conf.d/front.conf:ro
    depends_on:
      - php
    restart: unless-stopped

  php:
    <<: *php

  # Laravel's scheduler, in-container so no host cron is needed and the environment is
  # reproducible anywhere `docker compose up` runs. `schedule:work` stays in the
  # foreground and dispatches whatever routes/console.php has due each minute.
  scheduler:
    <<: *php
    command: php artisan schedule:work

  postgres:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE:-forest}
      POSTGRES_USER: ${DB_USERNAME:-forest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ${SHARED_PATH:-.}/docker/volumes/postgres_data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-forest}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  node:
    image: shopping_list-node
    build:
      context: ./docker/node
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    ports:
      - "${QUASAR_PORT:-9200}:9200"      # quasar dev -m pwa (9200 is Quasar's pwa-mode default)
    volumes:
      - ./front:/var/www/html
      - ./docker/volumes/node_home:/home/app
    restart: unless-stopped

  # The Android/TWA build toolchain (`docs/publish_todo.md` B0). Behind a profile because it
  # is a one-shot builder, not a service: `docker compose up` must not start it, and
  # `deploy.php`'s explicit `compose_services` list keeps it off the server too.
  #
  #   docker compose --profile android run --rm android bubblewrap build
  #
  # `~/.gradle` is a named volume rather than a bind mount: it holds a few hundred MB of
  # downloaded Gradle distributions and caches that belong to the container, not the repo,
  # and keeping them means the second build is not another cold start.
  android:
    profiles: ["android"]
    image: shopping_list-android
    build:
      context: ./docker/android
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    volumes:
      - ./twa:/work
      - android_gradle:/home/app/.gradle

  mailpit:
    image: axllent/mailpit:v1.29.7
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

# Only the Android build cache. Everything else in this project is a bind mount under
# docker/volumes/ so it can be inspected and backed up with the repo; Gradle's caches are
# large, disposable and of no interest outside the container.
volumes:
  android_gradle:
