services:
  nginx:
    image: nginx:1.30.0-trixie
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./back:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    volumes:
      - ./back:/var/www/html
      - ./docker/volumes/php_home:/home/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE:-forest}
      POSTGRES_USER: ${DB_USERNAME:-forest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./docker/volumes/postgres_data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-forest}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  node:
    build:
      context: ./docker/node
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    ports:
      - "${QUASAR_PORT:-9000}:9000"
    volumes:
      - ./front:/var/www/html
      - ./docker/volumes/node_home:/home/app
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29.7
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped