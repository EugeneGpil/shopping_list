server {
    listen 81;
    server_name _;
    root /var/www/front;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and the manifest must never be cached by the browser,
    # otherwise clients stay pinned to an old build. Exact-match locations take
    # priority over the regex block below, which would give sw.js 30 days.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|otf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Digital Asset Links. The Android app (docs/publish_todo.md B0) only runs as a real
    # Trusted Web Activity — full screen, no URL bar — if Chrome can fetch
    # /.well-known/assetlinks.json from this origin and find the APK's signing fingerprint
    # in it; otherwise it silently falls back to a Custom Tab, which is the browser chrome.
    #
    # `^~` is load-bearing: a plain prefix location loses to the regex below, which would
    # deny this as a dotfile. `^~` stops nginx from ever evaluating the regex on a match.
    #
    # **Five minutes, not `no-cache` and not the 30 days the block below hands every other
    # asset.** Chrome verifies this file when the app launches and keeps the toolbar — the
    # browser address bar — on screen until the verification passes. `no-cache` put a network
    # round trip on that path every single time, which is invisible on wifi and is exactly the
    # flash-of-address-bar reported on a roaming mobile connection. Five minutes takes the
    # request off the launch path without recreating the problem the old comment here was
    # guarding against: after a key change the worst case is one stale copy for five minutes,
    # rather than a URL bar for thirty days that nobody would connect to a deploy.
    # Raising this to a day is reasonable *once* Play's own app-signing fingerprint is in the
    # file and verified on a Play-installed build (docs/play_console.md step 5) — until then
    # this file is still changing.
    location ^~ /.well-known/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
