apply plugin: 'com.android.application'

android {
    namespace = "ru.evgenii_efimov.shopping_list"
    compileSdk = rootProject.ext.compileSdkVersion

    // Pinned so the container can pin the same version. Left unset, AGP falls back to its own
    // default and installs it mid-build over the network — see docker/capacitor/Dockerfile.
    buildToolsVersion = "36.0.0"

    defaultConfig {
        // The same package name as the TWA on Play (twa/twa-manifest.json). Permanent once an
        // AAB is uploaded, and it is what /.well-known/assetlinks.json names — a different id
        // here is an app that cannot reach the passkeys.
        applicationId "ru.evgenii_efimov.shopping_list"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        // **No `applicationIdSuffix` here, deliberately.** A suffixed debug package would
        // install beside the Play TWA instead of replacing it, which is nicer for comparing the
        // two — but every id has to exist in `google-services.json`, and the
        // `com.google.gms.google-services` plugin fails the build outright ("No matching client
        // found for package name") for one that does not. One package means one Android app to
        // register in the Firebase console, with one set of fingerprints, and that was the
        // trade taken.
        //
        // The consequence on the test phone: this build and the Play TWA cannot coexist. The
        // debug key is not Play's, so installing over it is refused — `adb uninstall
        // ru.evgenii_efimov.shopping_list` first, and reinstall the TWA from Play to go back.
        debug {
            versionNameSuffix "-dev"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Declared here even though capacitor-android already depends on it: that is an
    // `implementation` dependency of a library module, so its classes are not on this module's
    // compile classpath and MainActivity cannot see WebSettingsCompat without this line. The
    // version is the one Capacitor itself pins, in variables.gradle — do not fork it.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
