server {
    listen 81;
    server_name _;
    root /var/www/front;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and the manifest must never be cached by the browser,
    # otherwise clients stay pinned to an old build. Exact-match locations take
    # priority over the regex block below, which would give sw.js 30 days.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|otf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Digital Asset Links. The Android app (docs/publish_todo.md B0) only runs as a real
    # Trusted Web Activity — full screen, no URL bar — if Chrome can fetch
    # /.well-known/assetlinks.json from this origin and find the APK's signing fingerprint
    # in it; otherwise it silently falls back to a Custom Tab, which is the browser chrome.
    #
    # `^~` is load-bearing: a plain prefix location loses to the regex below, which would
    # deny this as a dotfile. `^~` stops nginx from ever evaluating the regex on a match.
    #
    # Five minutes, not the 30 days the block below hands every other asset: while fingerprints
    # are still being added to this file, a long cache after a key change means a URL bar that
    # nobody would connect to a deploy. Raising it to a day is reasonable *once* Play's own
    # app-signing fingerprint is in here and verified on a Play-installed build
    # (docs/play_console.md step 5) — until then this file is still changing.
    #
    # **This header does not control the address-bar flash on cold start, whatever an earlier
    # version of this comment claimed.** That flash is a race inside Chrome: the toolbar is on
    # screen from first paint until asset-link verification returns, and the TWA splash screen is
    # the only thing covering that window. Chrome's verifier does not fetch through the page's
    # HTTP cache, so `Cache-Control` here cannot shorten it — and Chrome persists the verdict per
    # package+origin, which is why the flash appears on the first launch or two after an install
    # and then stops. Do not reach for this header to fix it; measure on a device instead
    # (`adb shell pm get-app-links ru.evgenii_efimov.shopping_list`, and `OriginVerifier` in logcat).
    #
    # A *permanent* URL bar is a different fault with a real cause: a signing fingerprint missing
    # from this file. Play re-signs the AAB with its own key, so a Play-installed build presents a
    # third fingerprint that the debug and upload entries do not cover.
    location ^~ /.well-known/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
